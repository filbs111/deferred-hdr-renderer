<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>HDR, deferred lighting renderer test</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script type="text/javascript" src="lib/gl-matrix-min.js"></script>
    <script type="text/javascript" src="data/quad.js"></script>
    <script type="text/javascript" src="data/levelCubeData.js"></script>
    <script type="text/javascript" src="utils/keys.js"></script>    
    <script type="text/javascript" src="utils/buffer_utils.js"></script>
    <script type="text/javascript" src="utils/fullscreen.js"></script>
    <script type="text/javascript" src="utils/intermediate_rendering.js"></script>
    <script type="text/javascript" src="utils/shader_loader.js"></script>
    <script type="text/javascript" src="utils/texture_utils.js"></script>
    <script type="text/javascript" src="utils/webgl_utils.js"></script>
    <script src='main.js'></script>
</head>
<body onload="init()">
    <div id="canvas-container" style="position: relative; width: 1280px; height: 720px;">
      <canvas id="top-canvas" style="width:100%; height:100%; position: absolute; top: 0; left: 0; z-index: 2;"></canvas>
      <canvas id="bottom-canvas" width="100%" height="100%" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
    </div>

    <p>Select Rendering:</p>
    <input type="radio" id="drawforwardlinear" name="rendermoderadio"/>
    <label for="drawforwardlinear">Forward Linear</label>
    <input type="radio" id="drawforwardhdr" name="rendermoderadio" checked/>
    <label for="drawforwardhdr">Forward HDR</label>
    <input type="radio" id="drawnormals" name="rendermoderadio"/>
    <label for="drawnormals">Normals</label>
    <input type="radio" id="drawalbedo" name="rendermoderadio"/>
    <label for="drawalbedo">Albedo</label>
    <input type="radio" id="drawvecfromlight" name="rendermoderadio"/>
    <label for="drawvecfromlight">Vec From Point Light</label>

    <input type="radio" id="drawviaintermediate" name="rendermoderadio"/>
    <label for="drawviaintermediate">Linear via Intermediate</label>
    
</body>
</html>
